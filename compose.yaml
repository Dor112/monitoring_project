services:
  exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.diskstats
      - --collector.netdev
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9090
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  monitor:
    build: ./monitor
    network_mode: host
    init: true
    environment:
      ACTION_MODE: ${ACTION_MODE:-off}
      SMD_MACHINE: ${SMD_MACHINE:-machine-1-1}
      SMD_INTERVAL_SECONDS: ${SMD_INTERVAL_SECONDS:-0.1}
      SMD_START_INDEX: ${SMD_START_INDEX:-0}
    volumes:
      - ./data:/data:ro
      - /var/lib/nirs-memory-guard:/memory-guard:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.15
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: nirs-servermonitor-app
    volumes:
      - ./plugin:/var/lib/grafana/plugins/nirs-servermonitor-app:ro
      - ./grafana-app.yaml:/etc/grafana/provisioning/plugins/nirs-servermonitor.yaml:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
