95.59999999999997">Временные ряды · интерфейс PromQL</tspan></text><text x="350.0" y="574.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="25" fill="black" font-weight="bold"><tspan x="350.0" y="574.0">Аналитический серверный модуль</tspan></text><text x="350.0" y="657.15" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="23" fill="black" font-weight="normal"><tspan x="350.0" y="657.15">Z-нормализация и скользящее окно</tspan><tspan x="350.0" y="687.05">Isolation Forest и рекуррентный автоэнкодер</tspan><tspan x="350.0" y="716.9499999999999">Расчёт индекса, порогов и вклада метрик</tspan><tspan x="350.0" y="746.85">Выбор управляющего сценария</tspan></text><text x="920.0" y="574.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="23" fill="black" font-weight="bold"><tspan x="920.0" y="574.0">Исполнение команд</tspan></text><text x="920.0" y="654.1" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="22" fill="black" font-weight="normal"><tspan x="920.0" y="654.1">Агент оркестратора</tspan><tspan x="920.0" y="682.7" /><tspan x="920.0" y="711.3000000000001">Запуск сценария</tspan><tspan x="920.0" y="739.9000000000001">Проверка выполнения</tspan></text><text x="540.0" y="964.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="26" fill="black" font-weight="bold"><tspan x="540.0" y="964.0">Клиентский плагин Grafana</tspan></text><text x="290.0" y="1045.5" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="24" fill="black" font-weight="normal"><tspan x="290.0" y="1045.5">Состояние узла</tspan></text><text x="790.0" y="1045.5" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="24" fill="black" font-weight="normal"><tspan x="790.0" y="1045.5">Индекс